# Scheduled news collection. GitHub itself stores the knowledge base: each run downloads kb.zip from the
# "kb-data" branch, adds the new news, and saves it back. The Streamlit app downloads that file.
# No database account or keys needed. Optional repo secrets (Settings -> Secrets and variables ->
# Actions): GROQ_API_KEY (article summaries), ANTHROPIC_API_KEY (briefing takeaways), GNEWS_API_KEY.
name: Collect news

on:
  schedule:
    # 6 runs a day (times in UTC) = 06:45, 09:45, 13:45, 17:45, 21:45, 01:45 India time
    - cron: "15 1,4,8,12,16,20 * * *"
  workflow_dispatch: {}              # "Run workflow" button for a manual run

permissions:
  contents: write                    # to save kb.zip on the kb-data branch

concurrency:
  group: collect-news                # never two runs writing at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      APP_TIMEZONE: Asia/Kolkata
      KB_SOURCE: local
      BRIEFING_HOUR: "6"             # the 06:45 run writes the morning briefing
      RETENTION_DAYS: "14"           # keeps kb.zip small
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install
        run: |
          pip install -r requirements-collector.txt
          python -m spacy download en_core_web_sm

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Load the current knowledge base
        id: load
        run: |
          if git fetch --depth=1 origin kb-data; then
            git show origin/kb-data:kb.zip > kb.zip
            python -m scripts.kb_sync unpack kb.zip
          else
            echo "No kb-data branch yet - starting with an empty knowledge base"
          fi

      - name: Collect, process and store
        run: python -m agents.orchestrator --inline

      - name: Save the knowledge base to the kb-data branch
        # keep what was stored even if collection failed halfway - but never save if loading failed,
        # because that would replace the real database with an empty one
        if: always() && steps.load.outcome == 'success'
        run: |
          python -m scripts.kb_sync pack kb.zip
          mkdir publish && mv kb.zip publish/ && cd publish
          git init -q -b kb-data
          git add kb.zip
          git -c user.name="news-collector" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Knowledge base $(date -u +'%Y-%m-%d %H:%M') UTC"
          # one commit that replaces the previous one, so the repository does not grow
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kb-data
